# Spring Boot Production Properties

# Database configuration (typically MySQL/PostgreSQL URL injected at runtime)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Arul@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Camunda Engine Settings
camunda.bpm.database.schema-update=true
camunda.bpm.job-execution.enabled=true
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:admin}
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:admin}
camunda.bpm.admin-user.email=${CAMUNDA_ADMIN_EMAIL:admin@localhost}


# Server Port
server.port=${PORT:8081}

# Logging Settings
logging.level.org.camunda.bpm=WARN
logging.level.com.foodorder.order=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
